
name: Build Pokémon PvP Trainer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/danish/pvp
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PokemonPvPTrainer"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.danish.pvp'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.danish.pvp'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6750A4</item>
                  <item name="android:statusBarColor">#17152A</item>
                  <item name="android:navigationBarColor">#17152A</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="PvP Trainer"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/danish/pvp/MainActivity.java <<'EOF'
          package com.danish.pvp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.*;

          public class MainActivity extends Activity {
              int hp = 100;
              TextView status, health;
              LinearLayout root;

              TextView text(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(12, 12, 12, 12);
                  return t;
              }

              void button(String label, Runnable action) {
                  Button b = new Button(this);
                  b.setText(label);
                  root.addView(b);
                  b.setOnClickListener(v -> action.run());
              }

              void update() {
                  health.setText("Opponent HP: " + hp + "%");
                  if (hp <= 0) {
                      status.setText("Battle complete! You win!");
                  }
              }

              @Override
              public void onCreate(Bundle saved) {
                  super.onCreate(saved);

                  root = new LinearLayout(this);
                  root.setOrientation(1);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(20, 20, 20, 20);
                  root.setBackgroundColor(Color.rgb(23,21,42));

                  TextView title = text("POKÉMON PvP TRAINER", 25);
                  root.addView(title);

                  root.addView(text("Offline Practice Prototype", 16));
                  root.addView(text("YOUR POKÉMON", 14));
                  root.addView(text("⚡ Pikachu", 26));

                  health = text("Opponent HP: 100%", 20);
                  root.addView(health);

                  root.addView(text("OPPONENT", 14));
                  root.addView(text("💧 Squirtle", 26));

                  status = text("Choose an attack to practice!", 16);
                  root.addView(status);

                  button("⚡ Fast Attack", () -> {
                      if (hp > 0) {
                          hp -= 10;
                          status.setText("Fast attack used!");
                          update();
                      }
                  });

                  button("🔥 Charged Attack", () -> {
                      if (hp > 0) {
                          hp -= 25;
                          status.setText("Charged attack used!");
                          update();
                      }
                  });

                  button("↻ Reset Battle", () -> {
                      hp = 100;
                      status.setText("New practice battle!");
                      update();
                  });

                  setContentView(root);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-PvP-Trainer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
